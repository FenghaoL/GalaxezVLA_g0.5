# This file is injected through OVERRIDE_DATASET by train_4epochs.sh.
# It intentionally lives with the run scripts, rather than modifying the
# repository's generic configs/data/so100.yaml.
_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset
action_size: 32
past_action_size: 0
obs_size: 1
val_set_proportion: 0.05
is_training_set: true
embodiment_datasets:
  so101_square:
    type: g05.data.so100_canonical_dataset.SO100CanonicalLerobotDatasetV3
    embodiment_type: so100
    lerobot_ds_version: '3.0'
    load_images: true
    # Keep fixed -> exterior and wrist -> wrist_right deterministic.  The generic
    # public-SO100 augmentation would sometimes swap these two camera roles.
    random_drop_camera: false
    shape_meta:
      action:
      - key: right_arm
        lerobot_key: action
        start_index: 0
        raw_shape: 6
        shape: 6
        time_offset: 0
      state:
      - key: right_arm
        lerobot_key: observation.state
        start_index: 0
        raw_shape: 6
        shape: 6
        time_offset: 0
      images:
      - key: exterior
        camera_type: exterior
        lerobot_key: __so100_exterior__
        start_index: 0
        raw_shape: [3, 480, 480]
        shape: [3, 480, 480]
        time_offset: 0
      - key: wrist_left
        camera_type: wrist_left
        lerobot_key: __so100_wrist_left__
        start_index: 0
        raw_shape: [3, 480, 640]
        shape: [3, 480, 640]
        time_offset: 0
      - key: wrist_right
        camera_type: wrist_right
        lerobot_key: __so100_wrist_right__
        start_index: 0
        raw_shape: [3, 480, 640]
        shape: [3, 480, 640]
        time_offset: 0
    # The raw weights are inverse task frame counts.  Combined with
    # data.use_weight_for_sampling=true in train_4epochs.sh, that makes the
    # four task groups contribute approximately equally per epoch.
    dataset_groups:
    - weight: 0.0001961938395  # 1 / 5097: Pick up the white block.
      dataset_dirs:
      - data/so101_g05_square_v1/01_pick_up_white_block/20260624_033532_g05_model_frame
      - data/so101_g05_square_v1/01_pick_up_white_block/20260624_034326_g05_model_frame
      - data/so101_g05_square_v1/01_pick_up_white_block/20260624_035150_g05_model_frame
      - data/so101_g05_square_v1/01_pick_up_white_block/20260624_040205_g05_model_frame
      - data/so101_g05_square_v1/01_pick_up_white_block/20260624_040834_g05_model_frame
      - data/so101_g05_square_v1/01_pick_up_white_block/20260624_041146_g05_model_frame
    - weight: 0.0002626050420  # 1 / 3808: Pick up the paper roll.
      dataset_dirs:
      - data/so101_g05_square_v1/02_pick_up_paper_roll/20260624_052314_g05_model_frame
      - data/so101_g05_square_v1/02_pick_up_paper_roll/20260624_053514_g05_model_frame
    - weight: 0.0001828153565  # 1 / 5470: Put the paper roll on the pink bowl.
      dataset_dirs:
      - data/so101_g05_square_v1/03_put_paper_roll_on_pink_bowl/20260624_055850_g05_model_frame
    - weight: 0.0001567149350  # 1 / 6381: Put the white block on the paper roll.
      dataset_dirs:
      - data/so101_g05_square_v1/04_put_white_block_on_paper_roll/20260624_044045_g05_model_frame
      - data/so101_g05_square_v1/04_put_white_block_on_paper_roll/20260624_050857_g05_model_frame
processors:
  so100:
    shape_meta:
      action:
      - key: right_arm
        lerobot_key: action
        start_index: 0
        raw_shape: 6
        shape: 6
        time_offset: 0
      state:
      - key: right_arm
        lerobot_key: observation.state
        start_index: 0
        raw_shape: 6
        shape: 6
        time_offset: 0
      images:
      - key: exterior
        camera_type: exterior
        lerobot_key: __so100_exterior__
        start_index: 0
        raw_shape: [3, 480, 480]
        shape: [3, 480, 480]
        time_offset: 0
      - key: wrist_left
        camera_type: wrist_left
        lerobot_key: __so100_wrist_left__
        start_index: 0
        raw_shape: [3, 480, 640]
        shape: [3, 480, 640]
        time_offset: 0
      - key: wrist_right
        camera_type: wrist_right
        lerobot_key: __so100_wrist_right__
        start_index: 0
        raw_shape: [3, 480, 640]
        shape: [3, 480, 640]
        time_offset: 0
    action_state_transforms:
    - _target_: g05.data_processor.transforms.relative_action.RelativeJointTransform
      keys: [right_arm]
    train_transforms:
      exterior: ${oc.load:configs/data/_transforms.yaml,train_head}
      wrist_left: ${oc.load:configs/data/_transforms.yaml,train_wrist}
      wrist_right: ${oc.load:configs/data/_transforms.yaml,train_wrist}
    val_transforms:
      exterior: ${oc.load:configs/data/_transforms.yaml,val_exterior}
      wrist_left: ${oc.load:configs/data/_transforms.yaml,val_wrist}
      wrist_right: ${oc.load:configs/data/_transforms.yaml,val_wrist}
    norm_default_mode: q01/q99
    norm_exception_mode: {}
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.DummyActionFilter
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.PaddingActionMerger
      merge: true
      max_action_shape_meta: {right_arm: 6}
      max_state_shape_meta: {right_arm: 6}
    num_obs_steps: 1
    use_stepwise_action_norm: true
    drop_high_level_prob: 1.0
    use_zh_instruction: false
